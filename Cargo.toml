[package]
name = "jas"
version = "0.4.0"
categories = ["command-line-utilities"]
description = "Just an installer"
edition = "2021"
publish = false
autobins = false
autotests = false
build = false
license = "MIT"
repository = "https://github.com/rikhuijzer/jas"
keywords = ["file", "filesystem", "tool"]

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
tar = "0.4"
flate2 = "1.1"
zip = { version = "7", default-features = false, features = ["deflate"] }

[[test]]
name = "cli"
path = "tests/cli.rs"

[profile.dev]
debug = 0
strip = "debuginfo"
split-debuginfo = "unpacked"
