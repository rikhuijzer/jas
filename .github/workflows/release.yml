name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash -n jas
      - run: sha256sum jas > jas.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            jas
            jas.sha256
          body: |
            Download the standalone jas Bash script and verify it against jas.sha256.
            Changes are documented in CHANGELOG.md.
