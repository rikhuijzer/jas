name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - run: bash -n jas
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(bash jas --version)" = "jas ${GITHUB_REF_NAME#v}"
      - run: sha256sum jas > jas.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            jas
            jas.sha256
          body: |
            jas is now a standalone Bash script. Rust is required only for testing;
            installation through cargo is no longer supported for this release.

            Download jas and verify its SHA-256 against a trusted, pinned checksum.
            The jas.sha256 asset records the checksum of this release's script.
            Installation instructions and a pinned checksum are in README.md.
            Changes are documented in CHANGELOG.md.
