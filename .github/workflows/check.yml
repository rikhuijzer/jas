name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash -n jas
      - run: cargo test --locked
      - name: Test macOS system Bash 3.2
        if: runner.os == 'macOS'
        run: PATH="/bin:$PATH" cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck jas
      - run: cargo fmt --all -- --check
      - run: cargo clippy --tests --locked -- -D warnings
